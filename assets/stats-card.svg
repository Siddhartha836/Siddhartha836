<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="50%" stop-color="#150d2a" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <!-- Neon Glow Border -->
    <linearGradient id="neonBorder" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#4cc9f0" />
    </linearGradient>

    <!-- Progress Bar Gradients -->
    <linearGradient id="jsGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f7df1e"/><stop offset="100%" stop-color="#eab308"/></linearGradient>
    <linearGradient id="htmlGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e34f26"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <linearGradient id="pyGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3776ab"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="cppGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Border & Container -->
  <rect x="0" y="0" width="800" height="200" rx="16" fill="url(#neonBorder)" opacity="0.6" />
  <rect x="2" y="2" width="796" height="196" rx="14" fill="url(#cardBg)" />

  <!-- LEFT SECTION: GITHUB OVERVIEW STATS -->
  <g transform="translate(30, 25)">
    <!-- Section Title -->
    <text x="0" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#ff2a85" letter-spacing="0.5">Siddhartha's GitHub Overview</text>
    <line x1="0" y1="30" x2="340" y2="30" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

    <!-- Stat 1: Total Commits -->
    <g transform="translate(0, 55)">
      <circle cx="12" cy="0" r="10" fill="#2d124d" />
      <path d="M 8 -4 L 16 4 M 16 -4 L 8 4" stroke="#ff2a85" stroke-width="2" />
      <text x="32" y="4" font-family="'Segoe UI', sans-serif" font-size="13" fill="#a0a0c0">Total Commits:</text>
      <text x="320" y="4" font-family="'Fira Code', monospace" font-weight="700" font-size="14" fill="#ffffff" text-anchor="end">250+</text>
    </g>

    <!-- Stat 2: Public Repos -->
    <g transform="translate(0, 85)">
      <circle cx="12" cy="0" r="10" fill="#0f2b45" />
      <path d="M 7 -3 L 17 -3 L 17 5 L 7 5 Z" fill="none" stroke="#4cc9f0" stroke-width="1.8" />
      <text x="32" y="4" font-family="'Segoe UI', sans-serif" font-size="13" fill="#a0a0c0">Public Repositories:</text>
      <text x="320" y="4" font-family="'Fira Code', monospace" font-weight="700" font-size="14" fill="#4cc9f0" text-anchor="end">7 Repos</text>
    </g>

    <!-- Stat 3: Contributed Repos -->
    <g transform="translate(0, 115)">
      <circle cx="12" cy="0" r="10" fill="#380d2d" />
      <polygon points="12,-6 14,-1 19,0 15,4 16,9 12,6 8,9 9,4 5,0 10,-1" fill="#f72585" />
      <text x="32" y="4" font-family="'Segoe UI', sans-serif" font-size="13" fill="#a0a0c0">Featured Stacks:</text>
      <text x="320" y="4" font-family="'Fira Code', monospace" font-weight="700" font-size="13" fill="#f72585" text-anchor="end">MERN &amp; Python</text>
    </g>

    <!-- Stat 4: Developer Rank -->
    <g transform="translate(0, 145)">
      <circle cx="12" cy="0" r="10" fill="#3a2500" />
      <path d="M 12 -6 L 16 2 L 8 2 Z" fill="#ffb703" />
      <text x="32" y="4" font-family="'Segoe UI', sans-serif" font-size="13" fill="#a0a0c0">Developer Score:</text>
      <rect x="255" y="-10" width="65" height="20" rx="10" fill="#2d124d" stroke="#ff2a85" stroke-width="1" />
      <text x="287" y="4" font-family="'Fira Code', monospace" font-weight="800" font-size="11" fill="#ff2a85" text-anchor="middle">A+ RANK</text>
    </g>
  </g>

  <!-- DIVIDER LINE -->
  <line x1="400" y1="20" x2="400" y2="180" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- RIGHT SECTION: TOP LANGUAGES BREAKDOWN -->
  <g transform="translate(430, 25)">
    <text x="0" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#4cc9f0" letter-spacing="0.5">Top Languages Breakdown</text>
    <line x1="0" y1="30" x2="340" y2="30" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

    <!-- Multi-Color Progress Bar -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="330" height="12" rx="6" fill="#1b1233" />
      <!-- JS: 35% (115px) -->
      <rect x="0" y="0" width="115" height="12" rx="6" fill="url(#jsGrad)" />
      <!-- HTML/CSS: 30% (99px) -->
      <rect x="117" y="0" width="99" height="12" fill="url(#htmlGrad)" />
      <!-- Python: 20% (66px) -->
      <rect x="218" y="0" width="66" height="12" fill="url(#pyGrad)" />
      <!-- C++/Java: 15% (44px) -->
      <path d="M 286 0 L 324 0 Q 330 0, 330 6 Q 330 12, 324 12 L 286 12 Z" fill="url(#cppGrad)" />
    </g>

    <!-- Language Legend Grid -->
    <!-- Row 1: JavaScript & HTML/CSS -->
    <g transform="translate(0, 85)">
      <circle cx="6" cy="0" r="5" fill="#f7df1e" />
      <text x="18" y="4" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#ffffff">JavaScript</text>
      <text x="130" y="4" font-family="'Fira Code', monospace" font-size="12" fill="#a0a0c0">35.0%</text>

      <circle cx="180" cy="0" r="5" fill="#e34f26" />
      <text x="192" y="4" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#ffffff">HTML / CSS</text>
      <text x="310" y="4" font-family="'Fira Code', monospace" font-size="12" fill="#a0a0c0">30.0%</text>
    </g>

    <!-- Row 2: Python & C++/Java -->
    <g transform="translate(0, 120)">
      <circle cx="6" cy="0" r="5" fill="#3776ab" />
      <text x="18" y="4" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Python</text>
      <text x="130" y="4" font-family="'Fira Code', monospace" font-size="12" fill="#a0a0c0">20.0%</text>

      <circle cx="180" cy="0" r="5" fill="#a855f7" />
      <text x="192" y="4" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#ffffff">C++ / Java</text>
      <text x="310" y="4" font-family="'Fira Code', monospace" font-size="12" fill="#a0a0c0">15.0%</text>
    </g>

    <!-- Status footer tag -->
    <g transform="translate(0, 152)">
      <rect x="0" y="0" width="330" height="20" rx="4" fill="#150d2a" stroke="#4cc9f0" stroke-width="0.5" />
      <text x="165" y="14" font-family="'Fira Code', monospace" font-size="10" fill="#4cc9f0" text-anchor="middle">⚡ VERIFIED GITHUB STATS &amp; LANGUAGES</text>
    </g>
  </g>
</svg>
