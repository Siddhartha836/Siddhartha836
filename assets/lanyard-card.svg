<svg xmlns="http://www.w3.org/2000/svg" width="340" height="520" viewBox="0 0 340 520" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="340" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="50%" stop-color="#150d2a" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <!-- Glowing Pink Gradient -->
    <linearGradient id="pinkGlow" x1="0" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#b5179e" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <!-- Strap Gradient -->
    <linearGradient id="strapGrad" x1="0" y1="0" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee440" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>

    <!-- Avatar Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Lanyard Strap Top -->
  <rect x="155" y="0" width="30" height="75" rx="4" fill="url(#strapGrad)" />
  <rect x="160" y="0" width="20" height="75" fill="#000" opacity="0.15" />
  
  <!-- Lanyard Metal Clip -->
  <rect x="148" y="70" width="44" height="14" rx="3" fill="#3a3a4c" stroke="#5a5a75" stroke-width="1" />
  <circle cx="170" cy="77" r="4" fill="#150d2a" />
  <path d="M 160 84 L 180 84 L 176 96 L 164 96 Z" fill="#4b4b60" />
  <ellipse cx="170" cy="96" rx="8" ry="4" fill="#252535" />

  <!-- Badge Card Container -->
  <g transform="translate(10, 95)">
    <!-- Outer Card Glow Border -->
    <rect x="0" y="0" width="320" height="415" rx="20" fill="url(#pinkGlow)" opacity="0.8" />
    <!-- Inner Card Body -->
    <rect x="2" y="2" width="316" height="411" rx="18" fill="url(#cardBg)" />

    <!-- Top Card Header Accent -->
    <path d="M 2 20 Q 2 2, 20 2 L 300 2 Q 318 2, 318 20 L 318 45 L 2 45 Z" fill="url(#pinkGlow)" opacity="0.3" />
    
    <!-- Lanyard Hole Slot -->
    <rect x="135" y="12" width="50" height="10" rx="5" fill="#090514" stroke="#ff2a85" stroke-width="1.5" />

    <!-- Avatar Container -->
    <g transform="translate(160, 130)">
      <!-- Avatar Outer Ring Glow -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#pinkGlow)" stroke-width="3" filter="url(#glow)" />
      <circle cx="0" cy="0" r="49" fill="#1e1338" />

      <!-- User Image Embed -->
      <clipPath id="avatarClip">
        <circle cx="0" cy="0" r="46" />
      </clipPath>
      <image href="https://avatars.githubusercontent.com/u/148542159?v=4" x="-46" y="-46" width="92" height="92" clip-path="url(#avatarClip)" />
    </g>

    <!-- User Information -->
    <!-- Name -->
    <text x="160" y="215" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Siddhartha Panigrahi</text>
    
    <!-- Title / Subtitle Badge -->
    <rect x="65" y="228" width="190" height="24" rx="12" fill="#2d124d" stroke="#ff2a85" stroke-width="1" />
    <text x="160" y="244" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#4cc9f0" text-anchor="middle" letter-spacing="1.5">FULL-STACK DEVELOPER</text>

    <!-- Handle & Details -->
    <text x="160" y="272" font-family="'Fira Code', monospace" font-weight="500" font-size="13" fill="#b5179e" text-anchor="middle">@Siddhartha836</text>

    <!-- Divider Line -->
    <line x1="40" y1="288" x2="280" y2="288" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

    <!-- Quick Info Grid -->
    <g transform="translate(40, 305)">
      <!-- Location -->
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" fill="#a0a0c0">🎓 University:</text>
      <text x="240" y="0" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="end">LPU, India</text>

      <!-- Focus -->
      <text x="0" y="22" font-family="'Segoe UI', sans-serif" font-size="12" fill="#a0a0c0">⚡ Specialty:</text>
      <text x="240" y="22" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#7209b7" text-anchor="end">MERN &amp; Python</text>

      <!-- Status -->
      <text x="0" y="44" font-family="'Segoe UI', sans-serif" font-size="12" fill="#a0a0c0">🟢 Status:</text>
      <text x="240" y="44" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#4cc9f0" text-anchor="end">Available for Roles</text>
    </g>

    <!-- Bottom Barcode & Tech Accent -->
    <g transform="translate(40, 375)">
      <!-- Simulated Barcode Lines -->
      <rect x="0" y="0" width="3" height="22" fill="#ff2a85" />
      <rect x="6" y="0" width="2" height="22" fill="#ffffff" opacity="0.6" />
      <rect x="11" y="0" width="5" height="22" fill="#ff2a85" />
      <rect x="19" y="0" width="2" height="22" fill="#ffffff" opacity="0.6" />
      <rect x="24" y="0" width="4" height="22" fill="#7209b7" />
      <rect x="31" y="0" width="2" height="22" fill="#ffffff" opacity="0.6" />
      <rect x="36" y="0" width="6" height="22" fill="#4cc9f0" />
      <rect x="45" y="0" width="2" height="22" fill="#ffffff" opacity="0.6" />
      <rect x="50" y="0" width="3" height="22" fill="#ff2a85" />

      <!-- Verified Developer Badge right -->
      <rect x="140" y="0" width="100" height="22" rx="4" fill="#1b1233" stroke="#4cc9f0" stroke-width="0.8" />
      <text x="190" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#4cc9f0" text-anchor="middle">VERIFIED DEV</text>
    </g>

  </g>
</svg>
